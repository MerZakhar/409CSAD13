name: C++ CI

on:
  push:
    branches:
      - develop
      - master
      - main
  pull_request:
    branches:
      - develop
      - master
      - main

jobs:
  build-and-test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and test on Unix
        if: runner.os != 'Windows'
        run: bash ./ci.sh
      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: .\ci.bat
